upstream watchparty_app {
    server app:8080;
    keepalive 32;
}

# HLS media segments never change once packaged (a re-process is rare and
# rewrites them in place, so staleness is bounded by this TTL); playlists must
# always revalidate. Picks the Cache-Control per file type.
map $uri $media_cache {
    ~\.(ts|m4s|vtt|mp4)$ "public, max-age=3600";
    default              "no-cache";
}

server {
    listen 80;
    server_name _;

    # Don't advertise the nginx version in responses and error pages.
    server_tokens off;

    # Baseline hardening. NOTE: add_header does not merge — a location with any
    # add_header of its own drops everything inherited from here, so every
    # location below that sets Cache-Control repeats these. Keep them in sync.
    #
    # The app is same-origin and self-contained: no framing (clickjacking), no
    # MIME sniffing, no referrer leakage, and a CSP confining scripts/styles/
    # media to this origin. 'unsafe-inline' styles are required by the player;
    # blob: by hls.js (MSE buffers) and its worker.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Compress the text-ish payloads: HLS playlists, WebVTT subtitles, the SPA
    # bundle and API JSON shrink several-fold. (Video segments are already
    # compressed data — gzip would just burn CPU.)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/vnd.apple.mpegurl text/vtt application/json application/javascript text/css text/plain image/svg+xml;

    # nginx serves file bytes here; Go just sets X-Accel-Redirect pointing to this location.
    # `internal` means the location is unreachable from the outside — only via X-Accel-Redirect.
    location /internal-files/ {
        internal;
        alias /media/;
        # External/VR players pick the demuxer by content type; the /stream URL
        # carries no extension, so type it from the target file's extension.
        types {
            video/mp4         mp4 m4v mov;
            video/x-matroska  mkv;
            video/mp2t        ts m2ts;
        }
        default_type application/octet-stream;
        add_header Cache-Control $media_cache;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # Processed output produced by the pipeline: single MP4s and HLS packages.
    location /internal-processed/ {
        internal;
        alias /processed/;

        # Correct content types for HLS (Safari's native HLS is strict).
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                    ts;
            video/mp4                     m4s;
            video/mp4                     mp4;
            text/vtt                      vtt;
        }
        default_type application/octet-stream;
        add_header Cache-Control $media_cache;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # WebSocket for watch-party rooms. Needs Upgrade/Connection passthrough and a
    # long read timeout (the app pings every 30s to keep it alive). Regex wins
    # over the /api/ prefix below. proxy_buffering off so messages aren't held.
    location ~ ^/api/rooms/[^/]+/ws$ {
        proxy_pass         http://watchparty_app;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering    off;
    }

    # API → Go backend. The /stream endpoint replies with X-Accel-Redirect
    # pointing at one of the internal locations above, which nginx then serves.
    location /api/ {
        proxy_pass         http://watchparty_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        # The client's real IP is authoritative for rate limiting; overwrite —
        # never append — these so a spoofed header can't forge a fresh IP each
        # request and slip past the login limiter. (chi RealIP trusts
        # True-Client-IP first, so it must be cleared too.)
        proxy_set_header   True-Client-IP    "";
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Do not buffer — critical for streaming and large uploads.
        proxy_buffering         off;
        proxy_request_buffering off;

        # tus sends large PATCH chunks; don't cap the body size.
        client_max_body_size 0;
    }

    # Public share folder. DELIBERATELY unauthenticated: the listing and the
    # files are readable by anyone who can reach this server, so only files meant
    # to be given away belong in DOWNLOAD_DIR. The pretty page is /download.html;
    # this location serves the raw bytes, and a request for the directory itself
    # returns the listing as JSON, which that page renders.
    # Trailing slashes on both location and alias matter — without them a
    # crafted path like /download../ could escape the folder.
    location /download/ {
        alias /download/;
        autoindex on;
        autoindex_format json;
        autoindex_localtime on;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # Vite emits content-hashed filenames — safe to cache forever.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri =404;
    }

    # Static SPA (built Svelte app). try_files falls back to index.html, which
    # must revalidate so a new deploy's asset hashes are picked up.
    location / {
        root      /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
